<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <!-- Rounded Background Square -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />
  
  <!-- Stylized Gas Cylinder & Flame -->
  <path d="M50 20 C 40 35, 25 45, 25 65 C 25 82, 38 90, 50 90 C 62 90, 75 82, 75 65 C 75 45, 60 35, 50 20 Z" fill="url(#flameGrad)" opacity="0.9"/>
  
  <!-- Inner Flame (White/Yellowish for contrast) -->
  <path d="M50 45 C 45 55, 38 60, 38 70 C 38 78, 44 83, 50 83 C 56 83, 62 78, 62 70 C 62 60, 55 55, 50 45 Z" fill="#ffffff" opacity="0.4"/>
  
  <!-- Base/Cylinder detail -->
  <rect x="40" y="85" width="20" height="5" rx="2" fill="#3b82f6" />
</svg>
